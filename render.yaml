# Render Blueprint: one free web service, no dependencies to install.
services:
  - type: web
    name: nfpl-access-control
    runtime: python
    plan: free
    buildCommand: echo "no dependencies"
    startCommand: python -m app.api
    healthCheckPath: /api
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: NFPL_TODAY          # pins the sample world's "today" so absences/delegations stay as documented
        value: "2026-10-16"
